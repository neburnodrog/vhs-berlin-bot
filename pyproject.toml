[project]
name = "vhs-berlin-bot"
version = "0.1.0"
description = "Telegram bot that watches Berlin VHS for new bookable courses matching subscribed keywords."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Ruben Karlsson", email = "neburgordon@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot[job-queue,rate-limiter]>=22.6,<23",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.2,<6",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
vhsbot = "vhsbot.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vhsbot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # We deliberately mix CallbackQueryHandler + per_message=False in the
    # onboarding ConversationHandler — see handlers.register_handlers.
    "ignore::telegram.warnings.PTBUserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
